name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements.txt pyinstaller

      - name: Run XMP tests
        working-directory: source
        run: python -m unittest discover -s tests -v

      - name: Build application runtime
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --collect-all PySide6 --name SPS-LUT-Editor --add-data "source/assets;assets" source/main.py

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Create installer and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer\SPS-LUT-Editor-Portable.nsi
          $hash = (Get-FileHash release\SPS-LUT-Editor-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SPS-LUT-Editor-Setup.exe" | Set-Content -Encoding ascii release\SPS-LUT-Editor-Setup.exe.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/SPS-LUT-Editor-Setup.exe
            release/SPS-LUT-Editor-Setup.exe.sha256
